<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delayed Content - WebPilot AI Test</title>
</head>
<body style="font-family: sans-serif; padding: 2rem;">
    <h2>Delayed Content Loader</h2>
    <div id="container">Loading content...</div>

    <script>
        setTimeout(() => {
            document.getElementById('container').innerHTML = '<button id="delayed-btn" onclick="alert(\'Clicked!\')">Delayed Loaded Button</button>';
        }, 1500);
    </script>
</body>
</html>
