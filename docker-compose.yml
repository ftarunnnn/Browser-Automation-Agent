version: '3.8'

services:
  backend:
    build: .
    container_name: browser_agent_backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/agent_db
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./backend/storage:/app/backend/storage
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: browser_agent_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

  db:
    image: postgres:15-alpine
    container_name: browser_agent_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
